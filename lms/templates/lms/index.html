{% extends 'lms/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
    <h2>Создать платёж</h2>
    <form action="{% url 'lms:create-payment' %}" method="post">
        {% csrf_token %}
        <label>Название продукта: <input type="text" name="name" required></label><br>
        <label>Описание: <input type="text" name="description"></label><br>
        <label>Сумма (руб): <input type="number" name="amount" required></label><br>
        <button type="submit">Создать платёж</button>
    </form>
{% endblock %}
