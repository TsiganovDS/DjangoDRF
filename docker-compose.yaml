version: '3.8'

services:
  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
         SECRET_KEY: 'django-insecure-3ut-4_%$u#!mj1dp%2k6h2i7icu_r$#zb!3&&hbv12_+@f!u($'
      DEBUG: 'True'
      POSTGRES_DB: 'DjangoDRF'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: '1234'
      DB_HOST: 'db'
      DB_PORT: '5432'
      STRIPE_SECRET_KEY: settings.STRIPE_SECRET_KEY
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: 'DjangoDRF'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: '1234'

  redis:
    image: redis:6.2
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
